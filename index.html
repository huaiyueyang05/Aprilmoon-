<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aprilmoon Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0b0d;
  color:#e2e2e2;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  line-height:1.6;
}
.container{
  max-width:1200px;
  margin:0 auto;
  padding:60px 24px;
}
h1{
  font-weight:300;
  font-size:28px;
  letter-spacing:2px;
  margin-bottom:48px;
  color:#fff;
}
/* 时间轴条目，图片放下方 */
.timeline-item{
  padding:28px 0;
  border-bottom:1px solid #222;
}
.timeline-top-row{
  display:grid;
  grid-template-columns:160px 1fr 160px 110px;
  gap:18px;
  align-items:center;
  margin-bottom:16px;
}
.time{color:#888}
.band{font-size:18px;color:#fff}
.venue{color:#aaa;font-size:15px}
.btn-more{
  border:1px solid #444;
  background:transparent;
  color:#ccc;
  padding:10px 14px;
  cursor:pointer;
  transition:0.25s;
}
.btn-more:hover{
  border-color:#999;
  color:#fff;
}
/* 下方大图缩略图 */
.thumb-wrap{
  width:100%;
}
.thumb{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:6px;
  opacity:0.9;
}
/* 弹窗遮罩 */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.94);
  z-index:999;
  display:none;
  overflow-y:auto;
}
.modal-wrap{
  max-width:1400px;
  margin:48px auto;
  padding:0 22px;
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:28px;
}
.modal-title{font-size:21px;font-weight:300}
.close{
  color:#aaa;font-size:30px;cursor:pointer;
}
/* 瀑布流 masonry */
.waterfall{
  column-count:3;
  column-gap:16px;
}
@media(max-width:960px){.waterfall{column-count:2}}
@media(max-width:550px){.waterfall{column-count:1}}
.waterfall-item{
  break-inside:avoid;
  margin-bottom:16px;
}
.waterfall-item img{
  width:100%;
  display:block;
  border-radius:6px;
}
</style>
</head>
<body>
<div class="container">
  <h1>LIVE PHOTOGRAPHY</h1>
  <div id="timeline"></div>
</div>

<div class="modal-overlay" id="modal">

const timelineEl = document.getElementById('timeline');
shows.forEach((item, idx) => {
  const div = document.createElement('div');
  div.className = 'timeline-item';
  div.innerHTML = `
    <div class="timeline-top-row">
      <div class="time">${item.date}</div>
      <div class="band">${item.band}</div>
      <div class="venue">${item.venue}</div>
      <div>
        <button class="btn-more" data-index="${idx}">More</button>
      </div>
    </div>
    <div class="thumb-wrap">
        < img class="thumb" src="${item.thumb}" loading="lazy">
    </div>
  `;
  timelineEl.appendChild(div);
})

const modal = document.getElementById('modal');
const gallery = document.getElementById('gallery');
const modalTitle = document.getElementById('modal-title');
const closeBtn = document.getElementById('close');

document.addEventListener('click', function(e){
  if(e.target.classList.contains('btn-more')){
    const idx = parseInt(e.target.getAttribute('data-index'));
    const show = shows[idx];
    modalTitle.textContent = `${show.band} — ${show.date} · ${show.venue}`;
    gallery.innerHTML = '';
    show.images.forEach(src => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'waterfall-item';
      itemDiv.innerHTML = `< img src="${src}" loading="lazy">`;
      gallery.appendChild(itemDiv);
    });
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  }
})

closeBtn.onclick = () => {
  modal.style.display = 'none';
  document.body.style.overflow = '';
}
modal.onclick = (e) => {
  if(e.target === modal){
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}
