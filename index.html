<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio of Aprilmoon</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --text-main: #d1d1d1;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --accent-color: #c5a880;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
            border-bottom: 1px solid var(--border-color);
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: normal;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* 主体容器 */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 时间轴卡片 */
        .timeline-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .timeline-top-row {
            display: grid;
            grid-template-columns: 120px 1fr 140px 100px;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .band {
            font-size: 1.1rem;
            color: #fff;
            font-weight: 500;
        }

        .venue {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-more {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .btn-more:hover {
            border-color: var(--accent-color);
            background: rgba(197, 168, 128, 0.05);
        }

        /* 缩略图样式 */
        .thumb-wrap {
            width: 100%;
            margin-top: 15px;
        }

        .thumb {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            opacity: 0.9;
        }

        /* 分页器样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 50px 0 20px;
        }

        .page-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .page-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #121212;
            font-weight: 500;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 999;
            display: none;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal-wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #fff;
            font-weight: normal;
        }

        .close {
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close:hover {
            color: #fff;
        }

        /* 瀑布流 masonry */
        .waterfall {
            column-count: 3;
            column-gap: 15px;
        }
        @media(max-width: 960px) { .waterfall { column-count: 2; } }
        @media(max-width: 550px) { .waterfall { column-count: 1; } }

        .waterfall-item {
            break-inside: avoid;
            margin-bottom: 15px;
        }

        .waterfall-item img {
            width: 100%;
            display: block;
            border-radius: 4px;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        @media(max-width: 768px) {
            .timeline-top-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

const pageSize = 10; // 每页显示的演出数量
let currentPage = 1;  // 默认初始页码

const timelineEl = document.getElementById('timeline');
const paginationEl = document.getElementById('pagination');

// 渲染当前页的数据和页码
function renderPage(page) {
    currentPage = page;
    timelineEl.innerHTML = '';

    // 计算当前页的数据切片
    const start = (page - 1) * pageSize;
    const end = start + pageSize;
    const pageShows = shows.slice(start, end);

    // 渲染当前页的演出条目
    pageShows.forEach((item, index) => {
        const globalIdx = start + index; // 获取原数组中的真实索引
        const div = document.createElement('div');
        div.className = 'timeline-item';
        div.innerHTML = `
            <div class="timeline-top-row">
                <div class="time">${item.date}</div>
                <div class="band">${item.band}</div>
                <div class="venue">${item.venue}</div>
                <div>
                    <button class="btn-more" data-index="${globalIdx}">More</button>
                </div>
            </div>
            <div class="thumb-wrap">
                <img class="thumb" src="${item.thumb}" loading="lazy" alt="${item.band}">
            </div>
        `;
        timelineEl.appendChild(div);
    });

    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' }); // 翻页时平滑滚动回顶部
}

// 渲染底部分页栏
function renderPagination() {
    paginationEl.innerHTML = '';
    const totalPages = Math.ceil(shows.length / pageSize);

    if (totalPages <= 1) return; // 如果只有一页则不显示分页栏

    // 上一页按钮
    const prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn';
    prevBtn.textContent = '上一页';
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => renderPage(currentPage - 1);
    paginationEl.appendChild(prevBtn);

    // 数字页码按钮
    for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => renderPage(i);
        paginationEl.appendChild(pageBtn);
    }

    // 下一页按钮
    const nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn';
    nextBtn.textContent = '下一页';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => renderPage(currentPage + 1);
    paginationEl.appendChild(nextBtn);
}

// 弹窗逻辑
const modal = document.getElementById('modal');
const gallery = document.getElementById('gallery');
const modalTitle = document.getElementById('modal-title');
const closeBtn = document.getElementById('close');

document.addEventListener('click', function(e){
    if(e.target.classList.contains('btn-more')){
        const idx = parseInt(e.target.getAttribute('data-index'));
        const show = shows[idx];
        modalTitle.textContent = `${show.band} — ${show.date} · ${show.venue}`;
        gallery.innerHTML = '';
        
        show.images.forEach(src => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'waterfall-item';
            itemDiv.innerHTML = `<img src="${src}" loading="lazy" alt="live photo">`;
            gallery.appendChild(itemDiv);
        });
        
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }
});

closeBtn.onclick = () => {
    modal.style.display = 'none';
    document.body.style.overflow = '';
};

modal.onclick = (e) => {
    if(e.target === modal){
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }
};
